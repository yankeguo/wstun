name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build-server
        run: go build -o wstun-server ./cmd/wstun-server

      - name: build-client
        run: go build -o wstun-client ./cmd/wstun-client

      - name: docker-setup
        uses: docker/setup-buildx-action@v4

      - name: docker-login-dockerhub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: yankeguo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker-login-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker-login-quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: yankeguo
          password: ${{ secrets.QUAY_TOKEN }}

      - name: docker-meta-server
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/yankeguo/wstun
            ghcr.io/yankeguo/wstun
            quay.io/yankeguo/wstun
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},prefix=server-v

      - name: docker-build-and-push-server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          pull: true
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: docker-meta-client
        id: meta-client
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/yankeguo/wstun
            ghcr.io/yankeguo/wstun
            quay.io/yankeguo/wstun
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},prefix=client-v

      - name: docker-build-and-push-client
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.client
          platforms: linux/amd64
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          pull: true
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
